name: Emby integration and real card rendering
on:
  push:
    branches: [v5.0.0-rewrite]
    paths:
      - '.github/workflows/emby-environment.yml'
      - 'tools/rewrite/emby_cloud_smoke.py'
      - 'tools/rewrite/emby_card_acceptance.mjs'
      - 'rewrite/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: emby-environment-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            architecture: amd64
            sha256: 1d718ffa0169c393de3eafda65b1b057a3db4ead93ffeb5883abd01735de9843
          - runner: ubuntu-22.04-arm
            architecture: arm64
            sha256: b3018884d85dcb09f6bf0d29f1296af277c5e2c99b5359b81d3a1e9a872045b7
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rewrite/src-tauri
      - name: Build actual Rust integration driver
        run: cargo build --locked --manifest-path rewrite/src-tauri/Cargo.toml -p tcm-core --example emby_acceptance
      - name: Install browser and sample-video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          cd rewrite
          npm ci
          npx playwright install --with-deps chromium
      - name: Download pinned official Emby server
        env:
          EMBY_ARCH: ${{ matrix.architecture }}
        run: |
          curl --fail --location --retry 3 --max-time 180 \
            "https://github.com/MediaBrowser/Emby.Releases/releases/download/4.9.5.0/emby-server-deb_4.9.5.0_${EMBY_ARCH}.deb" \
            --output "$RUNNER_TEMP/emby.deb"
      - name: Real server API, web client, restart and cleanup
        env:
          EMBY_SHA256: ${{ matrix.sha256 }}
        run: |
          python3 tools/rewrite/emby_cloud_smoke.py --package "$RUNNER_TEMP/emby.deb" \
            --sha256 "$EMBY_SHA256" --report build/rewrite/emby-environment.json \
            --integration-driver rewrite/src-tauri/target/debug/examples/emby_acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TCM-Emby-environment-${{ matrix.architecture }}
          path: |
            build/rewrite/emby-environment.json
            build/rewrite/emby-card/
          retention-days: 3
          if-no-files-found: warn
