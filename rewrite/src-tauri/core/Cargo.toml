[package]
name = "tcm-core"
version = "4.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["侯雁泽"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
roxmltree = "0.21"
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }
ts-rs = { version = "11", features = ["serde-json-impl"] }
regex = "1"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
semver = "1"
url = "2"
base64 = "0.22"
minisign-verify = "0.2.5"
tar = "0.4"
flate2 = "1"
plist = "1"
